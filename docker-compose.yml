services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Flair}
      ENV: ${ENV:-production}
      DEBUG: ${DEBUG:-false}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      START_PERIOD: ${START_PERIOD:-0}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_DIR: ${LOG_DIR:-/tmp/flair-logs}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY doit être défini dans le fichier .env}
      GEMINI_MODEL: ${GEMINI_MODEL:?GEMINI_MODEL doit être défini dans le fichier .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN doit être défini dans le fichier .env}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flair

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flair

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - metrics_token
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://localhost:9090/-/healthy
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flair

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER doit être défini dans le fichier .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD doit être défini dans le fichier .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://localhost:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flair

networks:
  flair:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

secrets:
  metrics_token:
    file: ./.metrics_token
